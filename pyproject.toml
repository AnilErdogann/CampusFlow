[project]
name = "campusflow"
version = "1.0.0"
description = "A production-style academic planning and analytics API for university students."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<6.0",
    "email-validator>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdfium2>=4.30,<6.0",
    "Pillow>=10.0,<13.0",
    "rapidocr>=3.9,<4.0",
    "onnxruntime>=1.20,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
]
desktop = [
    "pyinstaller>=6.20,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI's Depends/File defaults intentionally use callable defaults; E501 is
# handled by the formatter and ignored for long prompt/word-list literals.
ignore = ["B008", "E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
